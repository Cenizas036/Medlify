# Render Blueprint — Medlify API (free web service)
# Database lives on Neon; paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: medlify-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    # bootstrap-db.js sets up the schema/seed on first boot, then only runs migrations
    startCommand: node scripts/bootstrap-db.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
